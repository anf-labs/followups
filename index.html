<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Follow-Ups</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Follow-Ups">
<meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b87333'/%3E%3Cpath d='M18 33l10 10 18-20' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23b87333'/%3E%3Cpath d='M18 33l10 10 18-20' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#fafaf8; --card:#ffffff; --ink:#1d1d1f; --sub:#86868b; --line:#e8e8e3;
    --accent:#b87333; --accent-soft:#f6ede4; --red:#d92d20; --red-soft:#fef0ef;
    --green:#12805c; --green-soft:#e9f5f0; --wa:#1a8a5a; --wa-soft:#e5f4ec;
    --blue:#2f5496; --blue-soft:#e8eefc; --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#111113; --card:#1c1c1f; --ink:#f2f2f4; --sub:#8e8e93; --line:#2c2c30;
      --accent:#d99a5f; --accent-soft:#2a2119; --red:#f2726a; --red-soft:#2b1a18;
      --green:#4bbf95; --green-soft:#14261f; --wa:#4bbf8f; --wa-soft:#132720;
      --blue:#7aa0e0; --blue-soft:#18202f; }
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
    -webkit-font-smoothing:antialiased; padding:0 16px 90px;
  }
  .wrap{max-width:640px; margin:0 auto}
  input, select, button, textarea{font-family:inherit}

  /* ---------- auth ---------- */
  #authView{max-width:380px; margin:0 auto; padding-top:12vh}
  .brand{display:flex; align-items:center; gap:12px; margin-bottom:6px}
  .brand .logo{width:44px; height:44px; border-radius:12px; background:var(--accent); display:flex; align-items:center; justify-content:center}
  .brand .logo svg{width:26px; height:26px}
  .brand h1{font-size:24px; font-weight:700; letter-spacing:-.02em}
  .auth-sub{color:var(--sub); font-size:14px; margin:2px 0 26px 2px}
  .auth-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .auth-card h2{font-size:16px; font-weight:650; margin-bottom:4px}
  .auth-card p.hint{font-size:13px; color:var(--sub); margin-bottom:14px; line-height:1.4}
  .people-grid{display:flex; flex-direction:column; gap:8px}
  .person-btn{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    border:1px solid var(--line); background:transparent; color:var(--ink);
    border-radius:11px; padding:12px 14px; cursor:pointer; font-size:15px; font-weight:500; transition:all .12s;
  }
  .person-btn:hover{border-color:var(--accent); background:var(--accent-soft)}
  .avatar{width:32px; height:32px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex:0 0 auto}
  .role-tag{margin-left:auto; font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:.05em}
  .pin-box{display:flex; flex-direction:column; gap:12px; align-items:center; text-align:center}
  .pin-input{
    font-size:26px; letter-spacing:14px; text-align:center; width:100%; padding:12px;
    border:1.5px solid var(--line); border-radius:12px; background:transparent; color:var(--ink);
    outline:none; font-weight:600;
  }
  .pin-input:focus{border-color:var(--accent)}
  .btn-primary{
    background:var(--ink); color:var(--bg); border:none; border-radius:11px; padding:12px 18px;
    font-weight:650; cursor:pointer; font-size:15px; width:100%;
  }
  .btn-primary:active{transform:scale(.98)}
  .btn-ghost{background:transparent; border:none; color:var(--sub); font-size:13px; cursor:pointer; text-decoration:underline; padding:6px}
  .auth-err{color:var(--red); font-size:13px; min-height:18px; text-align:center}

  /* ---------- app header ---------- */
  header{padding:26px 2px 12px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
  header h1{font-size:26px; font-weight:700; letter-spacing:-.02em}
  .date{color:var(--sub); font-size:13.5px; margin-top:2px}
  .whoami{position:relative}
  .whoami-btn{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line);
    border-radius:99px; padding:5px 8px 5px 5px; cursor:pointer; font-size:13px; color:var(--ink)}
  .whoami-menu{position:absolute; right:0; top:44px; background:var(--card); border:1px solid var(--line);
    border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,.14); z-index:40; overflow:hidden; min-width:170px; display:none}
  .whoami-menu.open{display:block}
  .whoami-menu button{display:block; width:100%; text-align:left; border:none; background:transparent;
    padding:11px 15px; font-size:14px; color:var(--ink); cursor:pointer}
  .whoami-menu button:hover{background:var(--accent-soft)}
  .whoami-menu .label{padding:9px 15px 5px; font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:.05em}

  .tabs{display:flex; background:var(--line); border-radius:10px; padding:3px; gap:2px; margin-bottom:16px; overflow-x:auto}
  .tabs button{
    flex:1 0 auto; border:none; background:transparent; color:var(--sub); font-size:13px; font-weight:600;
    padding:7px 12px; border-radius:8px; cursor:pointer; white-space:nowrap; transition:all .15s;
  }
  .tabs button.on{background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08)}

  .add{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px; display:flex; flex-direction:column; gap:8px; box-shadow:0 1px 3px rgba(0,0,0,.04); margin-bottom:22px}
  .add input, .add select, .add button{font-size:15px}
  .add input{border:none; outline:none; background:transparent; color:var(--ink); padding:8px 6px; width:100%}
  .add input::placeholder{color:var(--sub)}
  #what{font-size:16px; font-weight:500}
  .add .row{display:flex; gap:8px; align-items:center; border-top:1px solid var(--line); padding-top:8px; flex-wrap:wrap}
  #who,#wgroup{flex:1 1 120px; min-width:0; border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:13.5px}
  #when,#attime,#repeat,#assignTo{color:var(--sub); flex:0 0 auto; border:1px solid var(--line); border-radius:8px;
    padding:6px 8px; background:transparent; font-size:13.5px; outline:none}
  #assignTo{color:var(--accent); font-weight:600; flex:1 1 120px}
  #repeat{appearance:none; -webkit-appearance:none; padding-right:22px;
    background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%2386868b' fill='none' stroke-width='1.5'/%3E%3C/svg%3E");
    background-repeat:no-repeat; background-position:right 8px center}
  #addBtn{background:var(--ink); color:var(--bg); border:none; border-radius:9px; padding:8px 18px; font-weight:600; cursor:pointer; flex:0 0 auto; margin-left:auto}
  #addBtn:active{transform:scale(.97)}

  .sec{margin-bottom:26px}
  .sec-h{display:flex; align-items:center; gap:8px; margin-bottom:10px; padding:0 2px;
    font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--sub)}
  .sec-h .count{background:var(--line); color:var(--sub); border-radius:99px; padding:1px 8px; font-size:11px}
  .sec-h .count.red{background:var(--red-soft); color:var(--red)}
  .sec-h.overdue{color:var(--red)} .sec-h.overdue .count{background:var(--red-soft); color:var(--red)}
  .sec-h.today{color:var(--accent)} .sec-h.today .count{background:var(--accent-soft); color:var(--accent)}
  .sec-h.person{text-transform:none; letter-spacing:0; font-size:14px; font-weight:650; color:var(--ink)}
  .sec-h.person.grp::before{content:"💬 "; font-size:13px}
  .sec-h.person.tm::before{content:"👤 "; font-size:13px}
  .sec-h .sub-lbl{font-size:12px; font-weight:500; color:var(--sub); margin-left:auto}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:0 1px 3px rgba(0,0,0,.04); overflow:hidden}
  .item{border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:none}
  .item-main{display:flex; align-items:center; gap:12px; padding:13px 14px; cursor:pointer}
  .tick{width:24px; height:24px; border-radius:50%; border:1.8px solid var(--sub); flex:0 0 auto; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .15s; background:transparent; color:transparent; font-size:13px}
  .tick:hover{border-color:var(--green); color:var(--line)}
  .item.done .tick{background:var(--green); border-color:var(--green); color:#fff}
  .item-body{flex:1; min-width:0}
  .item-title{font-size:15px; font-weight:500; line-height:1.35; word-wrap:break-word}
  .item.done .item-title{color:var(--sub); text-decoration:line-through}
  .item-meta{display:flex; gap:8px; align-items:center; margin-top:3px; font-size:12.5px; color:var(--sub); flex-wrap:wrap}
  .who-chip{font-weight:500}
  .grp-chip{color:var(--wa); background:var(--wa-soft); border-radius:99px; padding:1px 7px; font-size:11.5px; font-weight:500; white-space:nowrap}
  .asg-chip{color:var(--blue); background:var(--blue-soft); border-radius:99px; padding:1px 7px; font-size:11.5px; font-weight:600; white-space:nowrap}
  .due{white-space:nowrap}
  .due.late{color:var(--red); font-weight:600}
  .due.today{color:var(--accent); font-weight:600}
  .rep-chip{color:var(--sub); white-space:nowrap}
  .fu-count{color:var(--sub)}
  .bump{border:none; background:transparent; color:var(--sub); cursor:pointer; font-size:17px; padding:6px; border-radius:8px; flex:0 0 auto; line-height:1}
  .bump:hover{background:var(--line)}

  .detail{display:none; padding:2px 14px 14px 50px; animation:fade .15s ease}
  .item.open .detail{display:block}
  @keyframes fade{from{opacity:0; transform:translateY(-3px)}to{opacity:1; transform:none}}
  .log{margin-bottom:10px}
  .log-row{font-size:13px; color:var(--sub); padding:3px 0; line-height:1.45}
  .log-row b{color:var(--ink); font-weight:600}
  .note-add{display:flex; gap:8px}
  .note-add input{flex:1; border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:14px; background:transparent; color:var(--ink); outline:none}
  .note-add input:focus{border-color:var(--accent)}
  .note-add button{border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:9px; padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer}
  .edits{display:flex; gap:8px; margin-top:9px; flex-wrap:wrap}
  .edits input, .edits select{border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:12.5px; background:transparent; color:var(--ink); outline:none; flex:1 1 120px; min-width:0}
  .actions{display:flex; gap:12px; margin-top:9px; flex-wrap:wrap; align-items:center}
  .actions button, .actions input, .actions select{border:none; background:transparent; color:var(--sub); font-size:12.5px; cursor:pointer; padding:2px 0; outline:none}
  .actions button:hover{color:var(--ink)}
  .actions .del{margin-left:auto}
  .actions .del:hover{color:var(--red)}

  .menu{position:fixed; background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,.14); z-index:50; overflow:hidden; min-width:150px}
  .menu button{display:block; width:100%; text-align:left; border:none; background:transparent; padding:11px 16px; font-size:14px; color:var(--ink); cursor:pointer}
  .menu button:hover{background:var(--accent-soft)}

  .empty{text-align:center; color:var(--sub); padding:34px 10px; font-size:14.5px; background:var(--card); border:1px dashed var(--line); border-radius:var(--radius)}
  .done-toggle{background:transparent; border:none; color:var(--sub); font-size:13px; cursor:pointer; padding:4px 2px; display:flex; gap:6px; align-items:center}

  /* settings */
  .set-row{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap}
  .set-row:last-child{border-bottom:none}
  .set-row .nm{font-weight:600; font-size:14.5px}
  .set-row .rl{font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:.05em}
  .set-row.inactive{opacity:.5}
  .set-row .grow{flex:1}
  .set-row select, .set-row button{font-size:12.5px; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:8px; padding:5px 8px; cursor:pointer}
  .set-row button:hover{border-color:var(--accent)}
  .set-row button.danger:hover{border-color:var(--red); color:var(--red)}
  .pill{font-size:10.5px; padding:1px 7px; border-radius:99px; background:var(--accent-soft); color:var(--accent); font-weight:600}
  .add-user{display:flex; gap:8px; padding:12px 14px; flex-wrap:wrap; border-top:1px solid var(--line)}
  .add-user input, .add-user select{border:1px solid var(--line); border-radius:8px; padding:7px 9px; font-size:13.5px; background:transparent; color:var(--ink); outline:none}
  .add-user input{flex:1 1 130px; min-width:0}
  .add-user button{background:var(--ink); color:var(--bg); border:none; border-radius:8px; padding:7px 14px; font-weight:600; cursor:pointer}

  footer{text-align:center; margin-top:30px; font-size:12px; color:var(--sub)}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--ink); color:var(--bg);
    padding:10px 20px; border-radius:99px; font-size:13.5px; font-weight:500; transition:transform .25s ease; z-index:60; display:flex; gap:14px; align-items:center; max-width:90vw}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast button{background:transparent; border:none; color:var(--accent); font-weight:700; cursor:pointer; font-size:13.5px}
  .sync-dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--green); margin-right:5px; vertical-align:middle}
  .sync-dot.off{background:var(--red)}
</style>
</head>
<body>
<div class="wrap">
  <!-- AUTH -->
  <div id="authView">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 64 64"><path d="M18 33l10 10 18-20" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <h1>Follow-Ups</h1>
    </div>
    <div class="auth-sub">Team follow-up tracker</div>
    <div class="auth-card" id="authCard"><div class="empty" style="border:none">Loading…</div></div>
  </div>

  <!-- APP -->
  <div id="appView" hidden>
    <header>
      <div>
        <h1>Follow-Ups</h1>
        <div class="date" id="todayLabel"></div>
      </div>
      <div class="whoami">
        <button class="whoami-btn" id="whoamiBtn"><span class="avatar" id="myAvatar"></span><span id="myName"></span></button>
        <div class="whoami-menu" id="whoamiMenu">
          <div class="label" id="myRoleLabel"></div>
          <button id="changePinBtn">Change my PIN</button>
          <button id="backupBtn">Backup my view</button>
          <button id="logoutBtn">Log out</button>
        </div>
      </div>
    </header>

    <div class="tabs" id="tabs"></div>

    <div class="add" id="addBar">
      <input id="what" placeholder="What needs chasing?" autocomplete="off">
      <div class="row">
        <select id="assignTo" hidden title="Assign to"></select>
        <input id="who" placeholder="With whom" autocomplete="off" list="peopleList">
        <datalist id="peopleList"></datalist>
        <input id="wgroup" placeholder="WhatsApp group" autocomplete="off" list="groupList">
        <datalist id="groupList"></datalist>
        <input id="when" type="date" title="Follow up on">
        <input id="attime" type="time" title="Time (optional)">
        <select id="repeat" title="Repeat">
          <option value="">No repeat</option><option value="d">Daily</option><option value="w">Weekly</option>
          <option value="2w">Every 2 weeks</option><option value="m">Monthly</option>
        </select>
        <button id="addBtn">Add</button>
      </div>
    </div>

    <div id="viewMain"></div>

    <footer><span id="syncState"><span class="sync-dot"></span>Synced</span></footer>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="undoBtn" hidden>Undo</button></div>

<script>
(function(){
  const FN = 'https://lsoccelsirnctcvvlswq.supabase.co/functions/v1/followups';
  const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxzb2NjZWxzaXJuY3RjdnZsc3dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5OTQyNTksImV4cCI6MjA4ODU3MDI1OX0.__z2VweUJDpTJQ9UpMM9RU-UfgcOUXl_cAMChhn-i0s';
  const SKEY = 'fu-session-v2', VKEY = 'fu-view-v2';

  const $ = id => document.getElementById(id);
  const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const pad = n => String(n).padStart(2,'0');
  const dstr = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const todayStr = () => dstr(new Date());
  const fmt = s => s ? new Date(s+'T00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}) : '';
  const fmtTs = ts => new Date(ts).toLocaleDateString(undefined,{day:'numeric',month:'short'});
  const fmtTime = t => { if(!t) return ''; const d=new Date('1970-01-01T'+t); return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); };
  const addDays = (s,n) => { const d=new Date(s+'T00:00'); d.setDate(d.getDate()+n); return dstr(d); };
  const addMonths = (s,n) => { const d=new Date(s+'T00:00'); const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); return dstr(d); };
  const daysLate = s => s ? Math.round((new Date(todayStr()+'T00:00') - new Date(s+'T00:00'))/86400000) : 0;
  const REPEAT_LABEL = { d:'Daily', w:'Weekly', '2w':'Every 2 weeks', m:'Monthly' };
  const sortKey = i => (i.due||'9999-99-99') + 'T' + (i.attime||'~');
  const isBoss = r => r==='owner' || r==='ea';
  const initials = n => (n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();

  let session = null;
  try { session = JSON.parse(localStorage.getItem(SKEY)); } catch(e){}
  let state = { me:null, people:[], tasks:[] };
  let view = localStorage.getItem(VKEY) || 'timeline';
  let openId = null, lastDeleted = null, toastTimer = null, pollTimer = null;
  let settingsPeople = null;

  // ---------- api ----------
  async function api(action, extra){
    const body = Object.assign({ action }, extra||{});
    if (session && !['login','setPin','listPeople'].includes(action)){ body.actorId = session.id; body.pin = session.pin; }
    let res, data;
    try {
      res = await fetch(FN, { method:'POST', headers:{ 'Content-Type':'application/json', apikey:ANON, Authorization:'Bearer '+ANON }, body: JSON.stringify(body) });
      data = await res.json();
    } catch(e){ const err = new Error('network'); err.net = true; throw err; }
    if (!res.ok){ const err = new Error((data&&data.error)||('http_'+res.status)); err.status = res.status; throw err; }
    return data;
  }

  // ---------- toast ----------
  function toast(msg, undoable){
    $('toastMsg').textContent = msg; $('undoBtn').hidden = !undoable;
    const t = $('toast'); t.classList.add('show'); clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), undoable?5000:2400);
  }
  $('undoBtn').onclick = () => { if (lastDeleted){ const t=lastDeleted; lastDeleted=null; $('toast').classList.remove('show'); saveTask(t, true); } };

  // ================= AUTH =================
  function renderAuth(){
    const card = $('authCard');
    api('listPeople').then(r => {
      const people = r.people;
      card.innerHTML = '<h2>Who are you?</h2><p class="hint">Pick your name to sign in.</p><div class="people-grid" id="pg"></div>';
      const pg = $('pg');
      people.forEach(p => {
        const b = document.createElement('button');
        b.className = 'person-btn';
        b.innerHTML = '<span class="avatar">'+esc(initials(p.name))+'</span><span>'+esc(p.name)+'</span><span class="role-tag">'+(p.role==='member'?'':esc(p.role))+'</span>';
        b.onclick = () => pinStep(p);
        pg.appendChild(b);
      });
    }).catch(e => { card.innerHTML = '<div class="empty" style="border:none">Couldn\'t reach the server.<br><button class="btn-ghost" onclick="location.reload()">Retry</button></div>'; });
  }

  function pinStep(p){
    const card = $('authCard');
    const firstTime = !p.hasPin;
    card.innerHTML =
      '<h2>'+(firstTime?'Set your PIN':'Enter your PIN')+'</h2>'+
      '<p class="hint">'+esc(p.name)+(firstTime?' — choose a 4-digit PIN you\'ll remember. You\'ll use it to sign in.':'')+'</p>'+
      '<div class="pin-box">'+
        '<input class="pin-input" id="pin1" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off">'+
        (firstTime?'<input class="pin-input" id="pin2" inputmode="numeric" maxlength="8" placeholder="repeat" autocomplete="off">':'')+
        '<div class="auth-err" id="pinErr"></div>'+
        '<button class="btn-primary" id="pinGo">'+(firstTime?'Create & sign in':'Sign in')+'</button>'+
        '<button class="btn-ghost" id="pinBack">← back</button>'+
      '</div>';
    setTimeout(()=>$('pin1').focus(), 50);
    $('pinBack').onclick = renderAuth;
    const go = () => {
      const pin = $('pin1').value.trim();
      const errEl = $('pinErr');
      if (!/^\d{4,8}$/.test(pin)){ errEl.textContent = 'PIN must be 4–8 digits.'; return; }
      if (firstTime){
        if ($('pin2').value.trim() !== pin){ errEl.textContent = 'The two PINs don\'t match.'; return; }
        api('setPin', { name:p.name, pin }).then(r => finishLogin(r.me, pin))
          .catch(e => errEl.textContent = e.status===409 ? 'PIN already set — go back and enter it.' : 'Something went wrong.');
      } else {
        api('login', { name:p.name, pin }).then(r => finishLogin(r.me, pin))
          .catch(e => errEl.textContent = e.status===401 ? 'Wrong PIN, try again.' : (e.status===409?'No PIN yet — set one.':'Something went wrong.'));
      }
    };
    $('pinGo').onclick = go;
    $('pin1').addEventListener('keydown', e=>{ if(e.key==='Enter'){ if(firstTime) $('pin2').focus(); else go(); }});
    if (firstTime) $('pin2').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
  }

  function finishLogin(me, pin){
    session = { id:me.id, name:me.name, role:me.role, pin };
    localStorage.setItem(SKEY, JSON.stringify(session));
    startApp();
  }
  function logout(){ localStorage.removeItem(SKEY); session=null; if(pollTimer) clearInterval(pollTimer); location.reload(); }

  // ================= APP =================
  function peopleById(id){ return state.people.find(p=>p.id===id) || (settingsPeople||[]).find(p=>p.id===id); }
  function nameOf(id){ const p = peopleById(id); return p ? p.name : '—'; }

  async function refresh(silent){
    if (!session) return;
    // don't clobber while typing
    const ae = document.activeElement;
    if (silent && ae && (ae.tagName==='INPUT'||ae.tagName==='SELECT'||ae.tagName==='TEXTAREA')) return;
    try {
      const r = await api('getState');
      state.me = r.me; state.people = r.people; state.tasks = r.tasks;
      setSync(true);
      renderApp();
    } catch(e){
      setSync(false);
      if (e.status===401){ toast('Session expired — sign in again'); return logout(); }
      if (!silent) toast('Offline — changes may not have saved');
    }
  }
  function setSync(ok){ const el=$('syncState'); if(el) el.innerHTML = '<span class="sync-dot'+(ok?'':' off')+'"></span>'+(ok?'Synced':'Offline'); }

  async function startApp(){
    $('authView').hidden = true; $('appView').hidden = false;
    $('myName').textContent = session.name;
    $('myAvatar').textContent = initials(session.name);
    $('myRoleLabel').textContent = session.role==='owner'?'Owner':session.role==='ea'?'EA':'Member';
    $('todayLabel').textContent = new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
    buildTabs();
    await refresh();
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(()=>{ if(document.visibilityState==='visible') refresh(true); }, 15000);
  }
  window.addEventListener('focus', ()=>refresh(true));

  function buildTabs(){
    const boss = isBoss(session.role);
    const tabs = [['timeline','Timeline']];
    if (boss) tabs.push(['team','Team']);
    tabs.push(['contact','By Contact']); tabs.push(['group','By Group']);
    if (session.role==='owner') tabs.push(['settings','Settings']);
    const host = $('tabs'); host.innerHTML='';
    tabs.forEach(([k,label])=>{
      const b=document.createElement('button'); b.textContent=label; b.dataset.k=k;
      b.className = (view===k?'on':'');
      b.onclick=()=>setView(k); host.appendChild(b);
    });
    if (!tabs.some(t=>t[0]===view)) view='timeline';
  }
  function setView(v){ view=v; localStorage.setItem(VKEY,v); [...$('tabs').children].forEach(b=>b.classList.toggle('on', b.dataset.k===v)); renderApp(); }

  // ---------- add ----------
  function setupAdd(){
    $('when').value = todayStr();
    const boss = isBoss(session.role);
    const sel = $('assignTo');
    sel.hidden = !boss;
    if (boss){
      sel.innerHTML = state.people.map(p=>'<option value="'+p.id+'"'+(p.id===session.id?' selected':'')+'>'+esc(p.name===session.name?'Me ('+p.name+')':p.name)+'</option>').join('');
    }
  }
  function addItem(){
    const what = $('what').value.trim();
    if (!what){ $('what').focus(); return; }
    const boss = isBoss(session.role);
    const task = { what, who:$('who').value.trim(), wgroup:$('wgroup').value.trim(),
      due: $('when').value||todayStr(), attime:$('attime').value||'', repeat:$('repeat').value||'',
      done:false, log:[], assigned_to: boss ? $('assignTo').value : session.id };
    $('what').value=''; $('who').value=''; $('wgroup').value=''; $('when').value=todayStr(); $('attime').value=''; $('repeat').value='';
    saveTask(task, true);
    $('what').focus();
  }

  // ---------- mutations ----------
  function saveTask(task, isNew){
    if (!isNew){ const i=state.tasks.findIndex(t=>t.id===task.id); if(i>=0){ state.tasks[i]=task; renderApp(); } }
    api('saveTask', { task }).then(r=>{
      const i=state.tasks.findIndex(t=>t.id===r.task.id);
      if (i>=0) state.tasks[i]=r.task; else state.tasks.push(r.task);
      // if boss reassigned away from a member's own view, refresh handles visibility
      renderApp(); setSync(true);
    }).catch(e=>{ setSync(false); toast(e.status===403?'Not allowed':'Save failed — refreshing'); refresh(); });
  }
  function deleteTask(task){
    lastDeleted = Object.assign({}, task); delete lastDeleted.id_keep;
    state.tasks = state.tasks.filter(t=>t.id!==task.id); renderApp();
    api('deleteTask', { id: task.id }).then(()=>toast('Deleted', true)).catch(e=>{ toast('Delete failed — refreshing'); refresh(); });
  }
  function completeItem(item){
    if (item.repeat){
      const base = daysLate(item.due)>0 ? todayStr() : item.due;
      const next = item.repeat==='d'?addDays(base,1):item.repeat==='w'?addDays(base,7):item.repeat==='2w'?addDays(base,14):item.repeat==='m'?addMonths(base,1):item.due;
      item.log = (item.log||[]).concat([{ ts:Date.now(), text:'Done ✓ — next '+fmt(next), sys:true, by:session.name }]);
      item.due = next; saveTask(item); toast('Done ✓ · next '+fmt(next));
    } else {
      item.done = !item.done; item.done_at = item.done ? new Date().toISOString() : null;
      if (item.done) item.log = (item.log||[]).concat([{ ts:Date.now(), text:'Done ✓', sys:true, by:session.name }]);
      saveTask(item); if (item.done) toast('Nice — done ✓');
    }
  }

  // ---------- bump menu ----------
  let menuEl=null;
  function closeMenu(){ if(menuEl){ menuEl.remove(); menuEl=null; } }
  document.addEventListener('click', e=>{ if(menuEl && !menuEl.contains(e.target)) closeMenu(); }, true);
  function showBumpMenu(anchor, item){
    closeMenu(); menuEl=document.createElement('div'); menuEl.className='menu';
    [['Tomorrow',1],['In 3 days',3],['Next week',7]].forEach(([label,n])=>{
      const b=document.createElement('button'); b.textContent=label;
      b.onclick=ev=>{ ev.stopPropagation(); const base=daysLate(item.due)>0?todayStr():item.due; item.due=addDays(base,n);
        item.log=(item.log||[]).concat([{ts:Date.now(),text:'Bumped to '+fmt(item.due),sys:true,by:session.name}]);
        closeMenu(); saveTask(item); toast('Moved to '+fmt(item.due)); };
      menuEl.appendChild(b);
    });
    document.body.appendChild(menuEl);
    const r=anchor.getBoundingClientRect(), mw=160;
    menuEl.style.top=Math.min(r.bottom+4, window.innerHeight-160)+'px';
    menuEl.style.left=Math.max(8, Math.min(r.right-mw, window.innerWidth-mw-8))+'px';
  }

  const isSysLog = l => l.sys || l.text==='Done ✓' || /^Done ✓ —/.test(l.text) || /^Bumped to /.test(l.text) || /^(Date|Time|Repeat|Person|Group|Assigned) /.test(l.text);
  function dueLabel(item){
    const n=daysLate(item.due), t=item.attime?' · '+fmtTime(item.attime):'';
    if(n>0) return '<span class="due late">'+(n===1?'1 day late':n+' days late')+'</span>';
    if(n===0) return '<span class="due today">Today'+t+'</span>';
    if(n===-1) return '<span class="due">Tomorrow'+t+'</span>';
    return '<span class="due">'+fmt(item.due)+t+'</span>';
  }

  function itemEl(item, opts){
    opts = opts||{};
    const boss = isBoss(session.role);
    const el=document.createElement('div');
    el.className='item'+(item.done?' done':'')+(openId===item.id?' open':'');
    const main=document.createElement('div'); main.className='item-main';
    const tick=document.createElement('button'); tick.className='tick'; tick.innerHTML='✓';
    tick.title=item.done?'Reopen':(item.repeat?'Done — schedules next':'Mark done');
    tick.onclick=e=>{ e.stopPropagation(); completeItem(item); };
    const body=document.createElement('div'); body.className='item-body';
    const meta=[];
    if (boss && !opts.hideAssignee && item.assigned_to) meta.push('<span class="asg-chip">'+esc(nameOf(item.assigned_to))+'</span>');
    if (!opts.hideWho && item.who) meta.push('<span class="who-chip">'+esc(item.who)+'</span>');
    if (!opts.hideGroup && item.wgroup) meta.push('<span class="grp-chip">💬 '+esc(item.wgroup)+'</span>');
    if (!item.done) meta.push(dueLabel(item)); else if(item.done_at) meta.push('<span class="due">Done '+fmtTs(item.done_at)+'</span>');
    if (item.repeat) meta.push('<span class="rep-chip">⟳ '+REPEAT_LABEL[item.repeat]+'</span>');
    const fus=(item.log||[]).filter(l=>!isSysLog(l)).length;
    if (fus) meta.push('<span class="fu-count">· '+fus+' follow-up'+(fus>1?'s':'')+'</span>');
    body.innerHTML='<div class="item-title">'+esc(item.what)+'</div>'+(meta.length?'<div class="item-meta">'+meta.join(' ')+'</div>':'');
    main.appendChild(tick); main.appendChild(body);
    if(!item.done){ const bump=document.createElement('button'); bump.className='bump'; bump.innerHTML='⏵'; bump.title='Push to later';
      bump.onclick=e=>{ e.stopPropagation(); showBumpMenu(bump,item); }; main.appendChild(bump); }
    main.onclick=()=>{ openId=(openId===item.id?null:item.id); renderApp(); };
    el.appendChild(main);

    const det=document.createElement('div'); det.className='detail';
    if ((item.log||[]).length){ const log=document.createElement('div'); log.className='log';
      item.log.slice().reverse().forEach(l=>{ const r=document.createElement('div'); r.className='log-row';
        r.innerHTML='<b>'+fmtTs(l.ts)+'</b> — '+esc(l.text)+(l.by&&!isSysLog(l)?' <span style="opacity:.6">('+esc(l.by)+')</span>':''); log.appendChild(r); });
      det.appendChild(log); }
    const na=document.createElement('div'); na.className='note-add';
    const ni=document.createElement('input'); ni.placeholder='Log a follow-up… e.g. "Called, will reply Monday"'; ni.onclick=e=>e.stopPropagation();
    const nb=document.createElement('button'); nb.textContent='Log';
    const addNote=()=>{ const t=ni.value.trim(); if(!t) return; item.log=(item.log||[]).concat([{ts:Date.now(),text:t,by:session.name}]); ni.value=''; openId=item.id; saveTask(item); };
    nb.onclick=e=>{ e.stopPropagation(); addNote(); }; ni.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.stopPropagation(); addNote(); }});
    na.appendChild(ni); na.appendChild(nb); det.appendChild(na);

    const eb=document.createElement('div'); eb.className='edits';
    const whoIn=document.createElement('input'); whoIn.placeholder='With whom'; whoIn.value=item.who||''; whoIn.setAttribute('list','peopleList'); whoIn.onclick=e=>e.stopPropagation();
    whoIn.onchange=()=>{ item.who=whoIn.value.trim(); item.log=(item.log||[]).concat([{ts:Date.now(),text:'Person '+(item.who||'cleared'),sys:true}]); saveTask(item); };
    const grpIn=document.createElement('input'); grpIn.placeholder='WhatsApp group'; grpIn.value=item.wgroup||''; grpIn.setAttribute('list','groupList'); grpIn.onclick=e=>e.stopPropagation();
    grpIn.onchange=()=>{ item.wgroup=grpIn.value.trim(); item.log=(item.log||[]).concat([{ts:Date.now(),text:'Group '+(item.wgroup||'cleared'),sys:true}]); saveTask(item); };
    eb.appendChild(whoIn); eb.appendChild(grpIn);
    if (boss){ const asg=document.createElement('select'); asg.onclick=e=>e.stopPropagation();
      asg.innerHTML=state.people.map(p=>'<option value="'+p.id+'"'+(p.id===item.assigned_to?' selected':'')+'>'+esc(p.name)+'</option>').join('');
      asg.onchange=()=>{ const nm=nameOf(asg.value); item.assigned_to=asg.value; item.log=(item.log||[]).concat([{ts:Date.now(),text:'Assigned to '+nm,sys:true}]); saveTask(item); };
      eb.appendChild(asg); }
    det.appendChild(eb);

    const acts=document.createElement('div'); acts.className='actions';
    if(!item.done){
      const dp=document.createElement('input'); dp.type='date'; dp.value=item.due||''; dp.onclick=e=>e.stopPropagation();
      dp.onchange=()=>{ item.due=dp.value; item.log=(item.log||[]).concat([{ts:Date.now(),text:'Date '+fmt(item.due),sys:true}]); saveTask(item); };
      const tp=document.createElement('input'); tp.type='time'; tp.value=item.attime||''; tp.onclick=e=>e.stopPropagation();
      tp.onchange=()=>{ item.attime=tp.value; item.log=(item.log||[]).concat([{ts:Date.now(),text:'Time '+(fmtTime(item.attime)||'cleared'),sys:true}]); saveTask(item); };
      const rp=document.createElement('select'); rp.innerHTML='<option value="">No repeat</option><option value="d">Daily</option><option value="w">Weekly</option><option value="2w">Every 2 weeks</option><option value="m">Monthly</option>';
      rp.value=item.repeat||''; rp.onclick=e=>e.stopPropagation();
      rp.onchange=()=>{ item.repeat=rp.value; item.log=(item.log||[]).concat([{ts:Date.now(),text:'Repeat '+(REPEAT_LABEL[item.repeat]||'off'),sys:true}]); saveTask(item); };
      acts.appendChild(dp); acts.appendChild(tp); acts.appendChild(rp);
    }
    const del=document.createElement('button'); del.className='del'; del.textContent='Delete';
    del.onclick=e=>{ e.stopPropagation(); deleteTask(item); };
    acts.appendChild(del); det.appendChild(acts);
    det.onclick=e=>e.stopPropagation(); el.appendChild(det);
    return el;
  }

  // ---------- grouped ----------
  function renderGrouped(host, field, itemOpts, kind){
    const open = state.tasks.filter(i=>!i.done);
    if (!open.length){ host.innerHTML='<div class="empty">Nothing pending 🎉</div>'; return; }
    const groups=new Map();
    open.forEach(i=>{
      let k, label;
      if (field==='assigned_to'){ k=i.assigned_to||'none'; label=i.assigned_to?nameOf(i.assigned_to):'Unassigned'; }
      else { const raw=(i[field]||'').trim(); k=raw.toLowerCase()||' none'; label=raw||(field==='wgroup'?'No group':'No contact'); }
      if(!groups.has(k)) groups.set(k,{k,label,items:[]});
      groups.get(k).items.push(i);
    });
    const t=todayStr(); const arr=[...groups.values()];
    arr.forEach(g=>g.items.sort((a,b)=>sortKey(a).localeCompare(sortKey(b))));
    arr.sort((a,b)=>sortKey(a.items[0]).localeCompare(sortKey(b.items[0])));
    host.innerHTML='';
    arr.forEach(g=>{
      const late=g.items.filter(i=>i.due&&i.due<t).length;
      const doneCount=state.tasks.filter(i=>{ if(!i.done) return false; if(field==='assigned_to') return (i.assigned_to||'none')===g.k; return ((i[field]||'').trim().toLowerCase()||' none')===g.k; }).length;
      const sec=document.createElement('div'); sec.className='sec';
      const h=document.createElement('div'); h.className='sec-h person'+(kind==='grp'?' grp':'')+(kind==='tm'?' tm':'');
      h.innerHTML=esc(g.label)+' <span class="count">'+g.items.length+' open</span>'+(late?' <span class="count red">'+late+' late</span>':'')+(doneCount?' <span class="sub-lbl">'+doneCount+' done</span>':'');
      const card=document.createElement('div'); card.className='card';
      g.items.forEach(i=>card.appendChild(itemEl(i,itemOpts)));
      sec.appendChild(h); sec.appendChild(card); host.appendChild(sec);
    });
  }

  // ---------- timeline ----------
  function renderTimeline(host){
    const t=todayStr();
    const open=state.tasks.filter(i=>!i.done);
    const overdue=open.filter(i=>i.due&&i.due<t).sort((a,b)=>sortKey(a).localeCompare(sortKey(b)));
    const today=open.filter(i=>i.due===t).sort((a,b)=>sortKey(a).localeCompare(sortKey(b)));
    const nodue=open.filter(i=>!i.due);
    const upcoming=open.filter(i=>i.due&&i.due>t).sort((a,b)=>sortKey(a).localeCompare(sortKey(b))).concat(nodue);
    const done=state.tasks.filter(i=>i.done).sort((a,b)=>(new Date(b.done_at||0))-(new Date(a.done_at||0))).slice(0,50);
    const sec=(title,cls,arr,extra)=>{ if(!arr.length&&!extra) return '';
      return '<div class="sec"><div class="sec-h '+cls+'">'+title+' <span class="count'+(cls==='overdue'?'':'')+'">'+arr.length+'</span></div><div class="card" data-list="'+title+'"></div></div>'; };
    host.innerHTML =
      (overdue.length?sec('Overdue','overdue',overdue):'')+
      '<div class="sec"><div class="sec-h today">Today <span class="count">'+today.length+'</span></div><div class="card" data-list="Today"></div></div>'+
      (upcoming.length?sec('Upcoming','',upcoming):'')+
      (done.length?'<div class="sec"><button class="done-toggle" id="doneToggle">▸ Done ('+done.length+')</button><div class="card" id="listDone" hidden style="margin-top:10px"></div></div>':'');
    const fill=(title,arr)=>{ const c=host.querySelector('[data-list="'+CSS.escape(title)+'"]'); if(!c) return; if(!arr.length){ c.outerHTML='<div class="empty">'+(title==='Today'?(overdue.length?'Nothing new today — clear the overdue ones above.':'All clear for today 🎉'):'')+'</div>'; return;} arr.forEach(i=>c.appendChild(itemEl(i))); };
    if(overdue.length) fill('Overdue',overdue);
    fill('Today',today);
    if(upcoming.length) fill('Upcoming',upcoming);
    if(done.length){ const dt=$('doneToggle'), dl=$('listDone');
      dt.onclick=()=>{ dl.hidden=!dl.hidden; dt.textContent=(dl.hidden?'▸':'▾')+' Done ('+done.length+')'; if(!dl.childElementCount) done.forEach(i=>dl.appendChild(itemEl(i))); };
    }
  }

      const act=document.createElement('button'); act.textContent=p.active?'Deactivate':'Reactivate';
      act.onclick=()=>{ api('adminSaveUser',{user:{id:p.id,name:p.name,role:p.role,active:!p.active}}).then(()=>{ toast('Updated'); renderSettings(host); }).catch(e=>toast(errMsg(e))); };
      const del=document.createElement('button'); del.className='danger'; del.textContent='Delete';

    });
    const addRow=document.createElement('div'); addRow.className='add-user';
    const anm=document.createElement('input'); anm.placeholder='New person\'s name';
    const arole=document.createElement('select'); arole.innerHTML='<option value="member">Member</option><option value="ea">EA</option><option value="owner">Owner</option>';
    const abtn=document.createElement('button'); abtn.textContent='Add user';

    addRow.appendChild(anm); addRow.appendChild(arole); addRow.appendChild(abtn);
    card.appendChild(addRow);
    host.innerHTML='<div class="sec-h">Team members</div>';
    host.appendChild(card);
    const note=document.createElement('p'); note.style.cssText='font-size:12.5px;color:var(--sub);margin-top:12px;line-height:1.5';
    note.innerHTML='New people appear on the sign-in screen and set their own PIN the first time. <b>Owner</b> & <b>EA</b> can assign tasks to anyone and see everyone\'s progress; <b>Members</b> see only their own. Deactivating hides someone from sign-in without deleting their history.';
    host.appendChild(note);
  }
  const errMsg=e=>({need_one_owner:'You need at least one owner',cant_delete_self:'You can\'t delete yourself',forbidden:'Not allowed',name_taken:'That name is taken'}[e.message]||'Something went wrong');

  // ---------- main render ----------
  function renderApp(){
    // datalists
    const pSeen=new Map(), gSeen=new Map();
    state.tasks.forEach(i=>{ const p=(i.who||'').trim(); if(p&&!pSeen.has(p.toLowerCase()))pSeen.set(p.toLowerCase(),p); const g=(i.wgroup||'').trim(); if(g&&!gSeen.has(g.toLowerCase()))gSeen.set(g.toLowerCase(),g); });
    $('peopleList').innerHTML=[...pSeen.values()].map(n=>'<option value="'+esc(n)+'">').join('');
    $('groupList').innerHTML=[...gSeen.values()].map(n=>'<option value="'+esc(n)+'">').join('');
    setupAdd();
    const host=$('viewMain');
    const showAdd = view!=='settings';
    $('addBar').style.display = showAdd?'':'none';
    if (view==='settings'){ renderSettings(host); return; }
    if (view==='team'){ renderGrouped(host,'assigned_to',{hideAssignee:true},'tm'); return; }
    if (view==='contact'){ renderGrouped(host,'who',{hideWho:true},''); return; }
    if (view==='group'){ renderGrouped(host,'wgroup',{hideGroup:true},'grp'); return; }
    renderTimeline(host);
  }

  // ---------- header menu ----------
  $('whoamiBtn').onclick=e=>{ e.stopPropagation(); $('whoamiMenu').classList.toggle('open'); };
  document.addEventListener('click',()=>$('whoamiMenu').classList.remove('open'));
  $('whoamiMenu').onclick=e=>e.stopPropagation();
  $('logoutBtn').onclick=logout;
  $('changePinBtn').onclick=()=>{
    $('whoamiMenu').classList.remove('open');
    const np=prompt('Enter a new 4-digit PIN:'); if(np==null) return;
    if(!/^\d{4,8}$/.test(np.trim())){ toast('PIN must be 4–8 digits'); return; }
    api('changePin',{newPin:np.trim()}).then(()=>{ session.pin=np.trim(); localStorage.setItem(SKEY,JSON.stringify(session)); toast('PIN updated'); }).catch(()=>toast('Couldn\'t update PIN'));
  };
  $('backupBtn').onclick=()=>{
    $('whoamiMenu').classList.remove('open');
    const blob=new Blob([JSON.stringify(state.tasks,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='followups-'+session.name+'-'+todayStr()+'.json'; a.click(); URL.revokeObjectURL(a.href);
  };
  $('addBtn').onclick=addItem;
  ['what','who','wgroup'].forEach(id=>$(id).addEventListener('keydown',e=>{ if(e.key==='Enter') addItem(); }));

  // ---------- boot ----------
  if (session){ startApp().catch(()=>renderAuth()); }
  else { $('appView').hidden=true; $('authView').hidden=false; renderAuth(); }
})();
</script>
</body>
</html>
