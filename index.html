<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Follow-Ups</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Follow-Ups">
<meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b87333'/%3E%3Cpath d='M18 33l10 10 18-20' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23b87333'/%3E%3Cpath d='M18 33l10 10 18-20' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#fafaf8; --card:#ffffff; --ink:#1d1d1f; --sub:#86868b; --line:#e8e8e3;
    --accent:#b87333; --accent-soft:#f6ede4; --red:#d92d20; --red-soft:#fef0ef;
    --green:#12805c; --green-soft:#e9f5f0; --wa:#1a8a5a; --wa-soft:#e5f4ec; --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#111113; --card:#1c1c1f; --ink:#f2f2f4; --sub:#8e8e93; --line:#2c2c30;
      --accent:#d99a5f; --accent-soft:#2a2119; --red:#f2726a; --red-soft:#2b1a18;
      --green:#4bbf95; --green-soft:#14261f; --wa:#4bbf8f; --wa-soft:#132720; }
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
    -webkit-font-smoothing:antialiased; padding:0 16px 90px;
  }
  .wrap{max-width:640px; margin:0 auto}
  header{padding:34px 2px 14px}
  h1{font-size:28px; font-weight:700; letter-spacing:-.02em}
  .date{color:var(--sub); font-size:14px; margin-top:3px}

  .tabs{display:flex; background:var(--line); border-radius:10px; padding:3px; gap:2px; margin-bottom:18px}
  .tabs button{
    flex:1; border:none; background:transparent; color:var(--sub); font-size:13px; font-weight:600;
    padding:7px 2px; border-radius:8px; cursor:pointer; font-family:inherit; transition:all .15s;
  }
  .tabs button.on{background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08)}

  .add{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px; display:flex; flex-direction:column; gap:8px;
    box-shadow:0 1px 3px rgba(0,0,0,.04); margin-bottom:22px;
  }
  .add input, .add select, .add button{font-size:15px; font-family:inherit}
  .add input{border:none; outline:none; background:transparent; color:var(--ink); padding:8px 6px; width:100%}
  .add input::placeholder{color:var(--sub)}
  #what{font-size:16px; font-weight:500}
  .add .row{display:flex; gap:8px; align-items:center; border-top:1px solid var(--line); padding-top:8px; flex-wrap:wrap}
  #who,#wgroup{flex:1 1 130px; min-width:0; border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:13.5px}
  #when,#attime,#repeat{
    color:var(--sub); flex:0 0 auto; border:1px solid var(--line); border-radius:8px;
    padding:6px 8px; background:transparent; font-size:13.5px; outline:none;
  }
  #repeat{appearance:none; -webkit-appearance:none; padding-right:22px;
    background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%2386868b' fill='none' stroke-width='1.5'/%3E%3C/svg%3E");
    background-repeat:no-repeat; background-position:right 8px center;}
  #addBtn{
    background:var(--ink); color:var(--bg); border:none; border-radius:9px;
    padding:8px 18px; font-weight:600; cursor:pointer; flex:0 0 auto; margin-left:auto;
  }
  #addBtn:active{transform:scale(.97)}

  .sec{margin-bottom:26px}
  .sec-h{
    display:flex; align-items:center; gap:8px; margin-bottom:10px; padding:0 2px;
    font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--sub);
  }
  .sec-h .count{background:var(--line); color:var(--sub); border-radius:99px; padding:1px 8px; font-size:11px}
  .sec-h .count.red{background:var(--red-soft); color:var(--red)}
  .sec-h.overdue{color:var(--red)} .sec-h.overdue .count{background:var(--red-soft); color:var(--red)}
  .sec-h.today{color:var(--accent)} .sec-h.today .count{background:var(--accent-soft); color:var(--accent)}
  .sec-h.person{text-transform:none; letter-spacing:0; font-size:14px; font-weight:650; color:var(--ink)}
  .sec-h.person.grp::before{content:"💬 "; font-size:13px}
  .sec-h .sub-lbl{font-size:12px; font-weight:500; color:var(--sub); margin-left:auto}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:0 1px 3px rgba(0,0,0,.04); overflow:hidden;
  }
  .item{border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:none}
  .item-main{display:flex; align-items:center; gap:12px; padding:13px 14px; cursor:pointer}
  .tick{
    width:24px; height:24px; border-radius:50%; border:1.8px solid var(--sub);
    flex:0 0 auto; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .15s; background:transparent; color:transparent; font-size:13px;
  }
  .tick:hover{border-color:var(--green); color:var(--line)}
  .item.done .tick{background:var(--green); border-color:var(--green); color:#fff}
  .item-body{flex:1; min-width:0}
  .item-title{font-size:15px; font-weight:500; line-height:1.35; word-wrap:break-word}
  .item.done .item-title{color:var(--sub); text-decoration:line-through}
  .item-meta{display:flex; gap:8px; align-items:center; margin-top:3px; font-size:12.5px; color:var(--sub); flex-wrap:wrap}
  .who-chip{font-weight:500}
  .grp-chip{color:var(--wa); background:var(--wa-soft); border-radius:99px; padding:1px 7px; font-size:11.5px; font-weight:500; white-space:nowrap}
  .due{white-space:nowrap}
  .due.late{color:var(--red); font-weight:600}
  .due.today{color:var(--accent); font-weight:600}
  .rep-chip{color:var(--sub); white-space:nowrap}
  .fu-count{color:var(--sub)}
  .bump{
    border:none; background:transparent; color:var(--sub); cursor:pointer;
    font-size:17px; padding:6px; border-radius:8px; flex:0 0 auto; line-height:1;
  }
  .bump:hover{background:var(--line)}

  .detail{display:none; padding:2px 14px 14px 50px; animation:fade .15s ease}
  .item.open .detail{display:block}
  @keyframes fade{from{opacity:0; transform:translateY(-3px)}to{opacity:1; transform:none}}
  .log{margin-bottom:10px}
  .log-row{font-size:13px; color:var(--sub); padding:3px 0; line-height:1.45}
  .log-row b{color:var(--ink); font-weight:600}
  .note-add{display:flex; gap:8px}
  .note-add input{
    flex:1; border:1px solid var(--line); border-radius:9px; padding:8px 10px;
    font-size:14px; background:transparent; color:var(--ink); outline:none; font-family:inherit;
  }
  .note-add input:focus{border-color:var(--accent)}
  .note-add button{
    border:1px solid var(--line); background:transparent; color:var(--ink);
    border-radius:9px; padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .edits{display:flex; gap:8px; margin-top:9px; flex-wrap:wrap}
  .edits input{
    border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:12.5px;
    background:transparent; color:var(--ink); outline:none; font-family:inherit; flex:1 1 130px; min-width:0;
  }
  .actions{display:flex; gap:12px; margin-top:9px; flex-wrap:wrap; align-items:center}
  .actions button, .actions input, .actions select{
    border:none; background:transparent; color:var(--sub); font-size:12.5px;
    cursor:pointer; padding:2px 0; font-family:inherit; outline:none;
  }
  .actions button:hover{color:var(--ink)}
  .actions .del{margin-left:auto}
  .actions .del:hover{color:var(--red)}

  .menu{
    position:fixed; background:var(--card); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,.14); z-index:50; overflow:hidden; min-width:150px;
  }
  .menu button{
    display:block; width:100%; text-align:left; border:none; background:transparent;
    padding:11px 16px; font-size:14px; color:var(--ink); cursor:pointer; font-family:inherit;
  }
  .menu button:hover{background:var(--accent-soft)}

  .empty{
    text-align:center; color:var(--sub); padding:34px 10px; font-size:14.5px;
    background:var(--card); border:1px dashed var(--line); border-radius:var(--radius);
  }
  .done-toggle{
    background:transparent; border:none; color:var(--sub); font-size:13px; cursor:pointer;
    padding:4px 2px; font-family:inherit; display:flex; gap:6px; align-items:center;
  }
  footer{text-align:center; margin-top:30px; font-size:12px; color:var(--sub)}
  footer button{
    background:transparent; border:none; color:var(--sub); font-size:12px;
    cursor:pointer; text-decoration:underline; font-family:inherit; padding:0 6px;
  }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
    background:var(--ink); color:var(--bg); padding:10px 20px; border-radius:99px;
    font-size:13.5px; font-weight:500; transition:transform .25s ease; z-index:60;
    display:flex; gap:14px; align-items:center; max-width:90vw;
  }
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast button{background:transparent; border:none; color:var(--accent); font-weight:700; cursor:pointer; font-size:13.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Follow-Ups</h1>
    <div class="date" id="todayLabel"></div>
  </header>

  <div class="tabs">
    <button id="tabTimeline" class="on">Timeline</button>
    <button id="tabPeople">By Person</button>
    <button id="tabGroups">By Group</button>
  </div>

  <div class="add">
    <input id="what" placeholder="What needs chasing?" autocomplete="off">
    <div class="row">
      <input id="who" placeholder="With whom" autocomplete="off" list="peopleList">
      <datalist id="peopleList"></datalist>
      <input id="wgroup" placeholder="WhatsApp group" autocomplete="off" list="groupList">
      <datalist id="groupList"></datalist>
      <input id="when" type="date" title="Follow up on">
      <input id="attime" type="time" title="Time (optional)">
      <select id="repeat" title="Repeat">
        <option value="">No repeat</option>
        <option value="d">Daily</option>
        <option value="w">Weekly</option>
        <option value="2w">Every 2 weeks</option>
        <option value="m">Monthly</option>
      </select>
      <button id="addBtn">Add</button>
    </div>
  </div>

  <div id="viewTimeline">
    <div class="sec" id="secOverdue" hidden>
      <div class="sec-h overdue">Overdue <span class="count" id="cntOverdue"></span></div>
      <div class="card" id="listOverdue"></div>
    </div>
    <div class="sec" id="secToday">
      <div class="sec-h today">Today <span class="count" id="cntToday"></span></div>
      <div class="card" id="listToday"></div>
    </div>
    <div class="sec" id="secUpcoming" hidden>
      <div class="sec-h">Upcoming <span class="count" id="cntUpcoming"></span></div>
      <div class="card" id="listUpcoming"></div>
    </div>
    <div class="sec" id="secDone" hidden>
      <button class="done-toggle" id="doneToggle">▸ Done (<span id="cntDone"></span>)</button>
      <div class="card" id="listDone" hidden style="margin-top:10px"></div>
    </div>
  </div>

  <div id="viewPeople" hidden></div>
  <div id="viewGroups" hidden></div>

  <footer>
    Saved automatically on this device ·
    <button id="exportBtn">Backup</button>·
    <button id="importBtn">Restore</button>
    <input type="file" id="importFile" accept=".json" hidden>
  </footer>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="undoBtn" hidden>Undo</button></div>

<script>
(function(){
  const KEY = 'followups-v1';
  let items = [];
  try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ items = []; }

  const $ = id => document.getElementById(id);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const pad = n => String(n).padStart(2,'0');
  const dstr = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const todayStr = () => dstr(new Date());
  const save = () => localStorage.setItem(KEY, JSON.stringify(items));
  const fmt = s => new Date(s+'T00:00').toLocaleDateString(undefined,{weekday:'short', day:'numeric', month:'short'});
  const fmtTs = ts => new Date(ts).toLocaleDateString(undefined,{day:'numeric', month:'short'});
  const fmtTime = t => { if(!t) return ''; const d = new Date('1970-01-01T'+t); return d.toLocaleTimeString(undefined,{hour:'numeric', minute:'2-digit'}); };
  const addDays = (s,n) => { const d = new Date(s+'T00:00'); d.setDate(d.getDate()+n); return dstr(d); };
  const addMonths = (s,n) => {
    const d = new Date(s+'T00:00'); const day = d.getDate();
    d.setDate(1); d.setMonth(d.getMonth()+n);
    const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(day, last)); return dstr(d);
  };
  const daysLate = s => Math.round((new Date(todayStr()+'T00:00') - new Date(s+'T00:00'))/86400000);
  const REPEAT_LABEL = { d:'Daily', w:'Weekly', '2w':'Every 2 weeks', m:'Monthly' };
  const sortKey = i => i.due + 'T' + (i.time || '~');

  function nextDue(item){
    const base = daysLate(item.due) > 0 ? todayStr() : item.due;
    if (item.repeat === 'd')  return addDays(base, 1);
    if (item.repeat === 'w')  return addDays(base, 7);
    if (item.repeat === '2w') return addDays(base, 14);
    if (item.repeat === 'm')  return addMonths(base, 1);
    return item.due;
  }

  let openId = null, lastDeleted = null, toastTimer = null;
  let view = localStorage.getItem('followups-view') || 'timeline';

  function toast(msg, undoable){
    $('toastMsg').textContent = msg;
    $('undoBtn').hidden = !undoable;
    const t = $('toast');
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), undoable ? 5000 : 2400);
  }
  $('undoBtn').onclick = () => {
    if (lastDeleted){ items.push(lastDeleted); lastDeleted = null; save(); render(); }
    $('toast').classList.remove('show');
  };

  // ---------- tabs ----------
  function setView(v){
    view = v; localStorage.setItem('followups-view', v);
    $('tabTimeline').classList.toggle('on', v === 'timeline');
    $('tabPeople').classList.toggle('on', v === 'people');
    $('tabGroups').classList.toggle('on', v === 'groups');
    $('viewTimeline').hidden = v !== 'timeline';
    $('viewPeople').hidden = v !== 'people';
    $('viewGroups').hidden = v !== 'groups';
    render();
  }
  $('tabTimeline').onclick = () => setView('timeline');
  $('tabPeople').onclick = () => setView('people');
  $('tabGroups').onclick = () => setView('groups');

  // ---------- add ----------
  $('when').value = todayStr();
  function addItem(){
    const what = $('what').value.trim();
    if (!what){ $('what').focus(); return; }
    items.push({ id: uid(), what, who: $('who').value.trim(), wgroup: $('wgroup').value.trim(),
                 due: $('when').value || todayStr(), time: $('attime').value || '', repeat: $('repeat').value || '',
                 done: false, created: Date.now(), doneAt: null, log: [] });
    $('what').value = ''; $('who').value = ''; $('wgroup').value = ''; $('when').value = todayStr();
    $('attime').value = ''; $('repeat').value = '';
    save(); render(); $('what').focus();
  }
  $('addBtn').onclick = addItem;
  ['what','who','wgroup'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); }));

  // ---------- bump menu ----------
  let menuEl = null;
  function closeMenu(){ if (menuEl){ menuEl.remove(); menuEl = null; } }
  document.addEventListener('click', e => { if (menuEl && !menuEl.contains(e.target)) closeMenu(); }, true);
  function showBumpMenu(anchor, item){
    closeMenu();
    menuEl = document.createElement('div');
    menuEl.className = 'menu';
    [['Tomorrow',1], ['In 3 days',3], ['Next week',7]].forEach(([label,n])=>{
      const b = document.createElement('button');
      b.textContent = label;
      b.onclick = ev => {
        ev.stopPropagation();
        const base = daysLate(item.due) > 0 ? todayStr() : item.due;
        item.due = addDays(base, n);
        item.log.push({ ts: Date.now(), text: 'Bumped to ' + fmt(item.due), sys: true });
        closeMenu(); save(); render(); toast('Moved to ' + fmt(item.due));
      };
      menuEl.appendChild(b);
    });
    document.body.appendChild(menuEl);
    const r = anchor.getBoundingClientRect(), mw = 160;
    menuEl.style.top = Math.min(r.bottom + 4, window.innerHeight - 160) + 'px';
    menuEl.style.left = Math.max(8, Math.min(r.right - mw, window.innerWidth - mw - 8)) + 'px';
  }

  // ---------- render helpers ----------
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const isSysLog = l => l.sys || l.text === 'Done ✓' || /^Done ✓ —/.test(l.text) || /^Bumped to /.test(l.text) || /^(Date|Time|Repeat|Person|Group) set/.test(l.text);

  function dueLabel(item){
    const n = daysLate(item.due);
    const t = item.time ? ' · ' + fmtTime(item.time) : '';
    if (n > 0)   return '<span class="due late">'+ (n===1?'1 day late':n+' days late') +'</span>';
    if (n === 0) return '<span class="due today">Today'+t+'</span>';
    if (n === -1) return '<span class="due">Tomorrow'+t+'</span>';
    return '<span class="due">'+fmt(item.due)+t+'</span>';
  }

  function completeItem(item){
    if (item.repeat){
      const next = nextDue(item);
      item.log.push({ ts: Date.now(), text: 'Done ✓ — next ' + fmt(next), sys: true });
      item.due = next;
      save(); render();
      toast('Done ✓ · next ' + fmt(next));
    } else {
      item.done = !item.done;
      item.doneAt = item.done ? Date.now() : null;
      if (item.done) item.log.push({ ts: Date.now(), text: 'Done ✓', sys: true });
      save(); render();
      if (item.done) toast('Nice — done ✓');
    }
  }

  function itemEl(item, opts){
    opts = opts || {};
    const el = document.createElement('div');
    el.className = 'item' + (item.done ? ' done' : '') + (openId === item.id ? ' open' : '');

    const main = document.createElement('div');
    main.className = 'item-main';

    const tick = document.createElement('button');
    tick.className = 'tick'; tick.innerHTML = '✓';
    tick.title = item.done ? 'Reopen' : (item.repeat ? 'Done — schedules the next one' : 'Mark done');
    tick.onclick = e => { e.stopPropagation(); completeItem(item); };

    const body = document.createElement('div');
    body.className = 'item-body';
    const meta = [];
    if (!opts.hideWho && item.who) meta.push('<span class="who-chip">'+esc(item.who)+'</span>');
    if (!opts.hideGroup && item.wgroup) meta.push('<span class="grp-chip">💬 '+esc(item.wgroup)+'</span>');
    if (!item.done) meta.push(dueLabel(item));
    else if (item.doneAt) meta.push('<span class="due">Done '+fmtTs(item.doneAt)+'</span>');
    if (item.repeat) meta.push('<span class="rep-chip">⟳ '+REPEAT_LABEL[item.repeat]+'</span>');
    const fus = item.log.filter(l => !isSysLog(l)).length;
    if (fus) meta.push('<span class="fu-count">· '+fus+' follow-up'+(fus>1?'s':'')+'</span>');
    body.innerHTML = '<div class="item-title">'+esc(item.what)+'</div>' +
                     (meta.length ? '<div class="item-meta">'+meta.join(' ')+'</div>' : '');

    main.appendChild(tick);
    main.appendChild(body);

    if (!item.done){
      const bump = document.createElement('button');
      bump.className = 'bump'; bump.innerHTML = '⏵'; bump.title = 'Push to later';
      bump.onclick = e => { e.stopPropagation(); showBumpMenu(bump, item); };
      main.appendChild(bump);
    }
    main.onclick = () => { openId = (openId === item.id ? null : item.id); render(); };
    el.appendChild(main);

    // detail
    const det = document.createElement('div');
    det.className = 'detail';
    if (item.log.length){
      const log = document.createElement('div');
      log.className = 'log';
      item.log.slice().reverse().forEach(l => {
        const r = document.createElement('div');
        r.className = 'log-row';
        r.innerHTML = '<b>' + fmtTs(l.ts) + '</b> — ' + esc(l.text);
        log.appendChild(r);
      });
      det.appendChild(log);
    }

    const na = document.createElement('div');
    na.className = 'note-add';
    const ni = document.createElement('input');
    ni.placeholder = 'Log a follow-up… e.g. "Called, will reply Monday"';
    ni.onclick = e => e.stopPropagation();
    const nb = document.createElement('button');
    nb.textContent = 'Log';
    const addNote = () => {
      const t = ni.value.trim();
      if (!t) return;
      item.log.push({ ts: Date.now(), text: t });
      ni.value = ''; save(); render(); openId = item.id;
    };
    nb.onclick = e => { e.stopPropagation(); addNote(); };
    ni.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.stopPropagation(); addNote(); } });
    na.appendChild(ni); na.appendChild(nb);
    det.appendChild(na);

    // edit who / group
    const eb = document.createElement('div');
    eb.className = 'edits';
    const whoIn = document.createElement('input');
    whoIn.placeholder = 'With whom'; whoIn.value = item.who || ''; whoIn.setAttribute('list','peopleList');
    whoIn.onclick = e => e.stopPropagation();
    whoIn.onchange = () => { item.who = whoIn.value.trim(); item.log.push({ts:Date.now(), text:'Person set to '+(item.who||'none'), sys:true}); save(); render(); openId = item.id; };
    const grpIn = document.createElement('input');
    grpIn.placeholder = 'WhatsApp group'; grpIn.value = item.wgroup || ''; grpIn.setAttribute('list','groupList');
    grpIn.onclick = e => e.stopPropagation();
    grpIn.onchange = () => { item.wgroup = grpIn.value.trim(); item.log.push({ts:Date.now(), text:'Group set to '+(item.wgroup||'none'), sys:true}); save(); render(); openId = item.id; };
    eb.appendChild(whoIn); eb.appendChild(grpIn);
    det.appendChild(eb);

    const acts = document.createElement('div');
    acts.className = 'actions';
    if (!item.done){
      const dp = document.createElement('input');
      dp.type = 'date'; dp.value = item.due; dp.title = 'Follow up on';
      dp.onclick = e => e.stopPropagation();
      dp.onchange = () => { item.due = dp.value; item.log.push({ ts: Date.now(), text: 'Date set to ' + fmt(item.due), sys: true }); save(); render(); openId = item.id; };
      const tp = document.createElement('input');
      tp.type = 'time'; tp.value = item.time || ''; tp.title = 'Time';
      tp.onclick = e => e.stopPropagation();
      tp.onchange = () => { item.time = tp.value; item.log.push({ ts: Date.now(), text: 'Time set to ' + (fmtTime(item.time) || 'none'), sys: true }); save(); render(); openId = item.id; };
      const rp = document.createElement('select');
      rp.innerHTML = '<option value="">No repeat</option><option value="d">Daily</option><option value="w">Weekly</option><option value="2w">Every 2 weeks</option><option value="m">Monthly</option>';
      rp.value = item.repeat || '';
      rp.onclick = e => e.stopPropagation();
      rp.onchange = () => { item.repeat = rp.value; item.log.push({ ts: Date.now(), text: 'Repeat set to ' + (REPEAT_LABEL[item.repeat] || 'none'), sys: true }); save(); render(); openId = item.id; };
      acts.appendChild(dp); acts.appendChild(tp); acts.appendChild(rp);
    }
    const del = document.createElement('button');
    del.className = 'del'; del.textContent = 'Delete';
    del.onclick = e => {
      e.stopPropagation();
      lastDeleted = item;
      items = items.filter(x => x.id !== item.id);
      save(); render(); toast('Deleted', true);
    };
    acts.appendChild(del);
    det.appendChild(acts);
    det.onclick = e => e.stopPropagation();
    el.appendChild(det);
    return el;
  }

  function fillList(listId, arr, opts){
    const list = $(listId);
    list.innerHTML = '';
    arr.forEach(i => list.appendChild(itemEl(i, opts)));
  }

  // ---------- grouped view (people / groups) ----------
  function canonField(field, key){
    for (const i of items){
      if ((i[field] || '').trim().toLowerCase() === key) return i[field].trim();
    }
    return null;
  }
  function renderGrouped(field, hostId, itemOpts, isGroup){
    const host = $(hostId);
    host.innerHTML = '';
    const open = items.filter(i => !i.done);
    if (!open.length){ host.innerHTML = '<div class="empty">Nothing pending 🎉</div>'; return; }
    const groups = new Map();
    open.forEach(i => {
      const k = (i[field] || '').trim().toLowerCase() || ' none';
      if (!groups.has(k)) groups.set(k, { key:k, name: canonField(field,k) || (isGroup?'No group':'No person'), items: [] });
      groups.get(k).items.push(i);
    });
    const t = todayStr();
    const arr = [...groups.values()];
    arr.forEach(g => g.items.sort((a,b) => sortKey(a).localeCompare(sortKey(b)) || a.created - b.created));
    arr.sort((a,b) => sortKey(a.items[0]).localeCompare(sortKey(b.items[0])));
    arr.forEach(g => {
      const late = g.items.filter(i => i.due < t).length;
      const doneCount = items.filter(i => i.done && ((i[field]||'').trim().toLowerCase() || ' none') === g.key).length;
      const sec = document.createElement('div');
      sec.className = 'sec';
      const h = document.createElement('div');
      h.className = 'sec-h person' + (isGroup ? ' grp' : '');
      h.innerHTML = esc(g.name) +
        ' <span class="count">' + g.items.length + ' open</span>' +
        (late ? ' <span class="count red">' + late + ' late</span>' : '') +
        (doneCount ? ' <span class="sub-lbl">' + doneCount + ' done</span>' : '');
      const card = document.createElement('div');
      card.className = 'card';
      g.items.forEach(i => card.appendChild(itemEl(i, itemOpts)));
      sec.appendChild(h); sec.appendChild(card);
      host.appendChild(sec);
    });
  }

  // ---------- main render ----------
  function render(){
    // datalists (first-seen spelling)
    const pSeen = new Map(), gSeen = new Map();
    items.forEach(i => {
      const pk = (i.who || '').trim().toLowerCase();
      if (pk && !pSeen.has(pk)) pSeen.set(pk, i.who.trim());
      const gk = (i.wgroup || '').trim().toLowerCase();
      if (gk && !gSeen.has(gk)) gSeen.set(gk, i.wgroup.trim());
    });
    $('peopleList').innerHTML = [...pSeen.values()].map(n => '<option value="'+esc(n)+'">').join('');
    $('groupList').innerHTML = [...gSeen.values()].map(n => '<option value="'+esc(n)+'">').join('');

    if (view === 'people'){ renderGrouped('who', 'viewPeople', {hideWho:true}, false); return; }
    if (view === 'groups'){ renderGrouped('wgroup', 'viewGroups', {hideGroup:true}, true); return; }

    const t = todayStr();
    const open = items.filter(i => !i.done);
    const overdue  = open.filter(i => i.due <  t).sort((a,b)=>sortKey(a).localeCompare(sortKey(b)));
    const today    = open.filter(i => i.due === t).sort((a,b)=>sortKey(a).localeCompare(sortKey(b)) || a.created-b.created);
    const upcoming = open.filter(i => i.due >  t).sort((a,b)=>sortKey(a).localeCompare(sortKey(b)));
    const done     = items.filter(i => i.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).slice(0,50);

    $('secOverdue').hidden = !overdue.length;
    $('cntOverdue').textContent = overdue.length;
    fillList('listOverdue', overdue);

    $('cntToday').textContent = today.length;
    if (today.length){ fillList('listToday', today); }
    else { $('listToday').innerHTML = '<div class="empty">' + (overdue.length ? 'Nothing new today — clear the overdue ones above.' : 'All clear for today 🎉<br><span style="font-size:13px">Add a follow-up above.</span>') + '</div>'; }

    $('secUpcoming').hidden = !upcoming.length;
    $('cntUpcoming').textContent = upcoming.length;
    fillList('listUpcoming', upcoming);

    $('secDone').hidden = !done.length;
    $('cntDone').textContent = done.length;
    fillList('listDone', done);
  }

  $('doneToggle').onclick = () => {
    const l = $('listDone');
    l.hidden = !l.hidden;
    $('doneToggle').firstChild.textContent = (l.hidden ? '▸' : '▾') + ' Done (';
  };

  // ---------- backup / restore ----------
  $('exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(items, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'followups-backup-' + todayStr() + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
  };
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!Array.isArray(data)) throw new Error('bad');
        const have = new Set(items.map(i=>i.id));
        data.forEach(i => { if (i && i.id && !have.has(i.id)) items.push(i); });
        save(); render(); toast('Restored ✓');
      } catch(err){ toast('Could not read that file'); }
    };
    r.readAsText(f);
    e.target.value = '';
  };

  $('todayLabel').textContent = new Date().toLocaleDateString(undefined,{weekday:'long', day:'numeric', month:'long'});
  setView(view);
})();
</script>
</body>
</html>
